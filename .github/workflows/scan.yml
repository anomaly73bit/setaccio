name: Scansione GitHub

on:
  schedule:
    - cron: "17 3 * * *"   # ogni notte alle 03:17 UTC
  workflow_dispatch:
    inputs:
      per_query:
        description: "Repo per linguaggio"
        default: "20"
      min_stars:
        description: "Stelle minime"
        default: "200"
      force:
        description: "Rianalizza tutto (ignora la cache)"
        type: boolean
        default: false
      query:
        description: "Query aggiuntiva (es. topic:llm) — opzionale"
        default: ""

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Esegui lo scanner
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_TOKEN || secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          ARGS="--per-query ${{ inputs.per_query || '20' }} --min-stars ${{ inputs.min_stars || '200' }} --max-minutes 270"
          if [ "${{ inputs.force }}" = "true" ]; then ARGS="$ARGS --force"; fi
          if [ -n "${{ inputs.query }}" ]; then ARGS="$ARGS --query '${{ inputs.query }}'"; fi
          eval python -m setaccio.scanner $ARGS

      - name: Salva i risultati
        run: |
          git config user.name "setaccio-bot"
          git config user.email "setaccio-bot@users.noreply.github.com"
          git add docs/data/repos.json data/setaccio.db
          git diff --cached --quiet || git commit -m "Scansione $(date -u +%Y-%m-%d)"
          git push
