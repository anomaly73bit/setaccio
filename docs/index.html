<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Setaccio — il meglio di GitHub, setacciato</title>
<meta name="description" content="Setaccio analizza i repository pubblici di GitHub e descrive ogni progetto: tipo di prodotto, tecnologie, stato e popolarità.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4efe6; --paper:#fbf8f2; --ink:#1f1b16; --muted:#6d655a; --line:#ddd3c3;
  --accent:#b4531f; --accent-soft:#f1dccd; --ok:#2f7a4b; --warn:#a1741a; --off:#8a8178;
  --chip:#ece4d6; --shadow:0 1px 0 rgba(31,27,22,.04),0 8px 24px -16px rgba(31,27,22,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16130f; --paper:#1f1b16; --ink:#efe8dc; --muted:#a59c8f; --line:#3a332a;
    --accent:#e58a4e; --accent-soft:#3d2a1d; --ok:#6cc290; --warn:#d9ad52; --off:#8a8178;
    --chip:#2b261f; --shadow:0 8px 24px -16px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#16130f; --paper:#1f1b16; --ink:#efe8dc; --muted:#a59c8f; --line:#3a332a;
  --accent:#e58a4e; --accent-soft:#3d2a1d; --ok:#6cc290; --warn:#d9ad52; --off:#8a8178;
  --chip:#2b261f; --shadow:0 8px 24px -16px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{padding:40px 0 24px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font-family:Fraunces,serif;font-weight:700;font-size:clamp(34px,6vw,56px);letter-spacing:-.02em;margin:0;line-height:1}
h1 span{color:var(--accent)}
.tag{color:var(--muted);font-size:16px;max-width:560px}
.meta{font:12px "IBM Plex Mono",monospace;color:var(--muted);margin-top:14px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.stat{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px}
.stat b{display:block;font:600 22px Fraunces,serif}
.stat small{color:var(--muted);font-size:12px}
.typebar{display:flex;height:8px;border-radius:4px;overflow:hidden;margin-top:18px;background:var(--chip)}
.typebar i{display:block;height:100%}
.controls{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:2fr repeat(4,1fr) auto;gap:8px}
input,select,button{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button{cursor:pointer}
.count{font:12px "IBM Plex Mono",monospace;color:var(--muted);padding:14px 0 4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;padding:8px 0 60px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.top{display:flex;gap:10px;align-items:center}
.top img{width:34px;height:34px;border-radius:8px;background:var(--chip)}
.name{font-weight:600;font-size:16px;line-height:1.2;word-break:break-word}
.owner{color:var(--muted);font-size:12px}
.type{display:inline-block;font:500 11px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.04em;background:var(--accent-soft);color:var(--accent);padding:3px 8px;border-radius:5px;align-self:flex-start}
.desc{margin:0;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--chip);border-radius:5px;padding:2px 7px;font-size:12px;color:var(--ink)}
.chip.lang{font-family:"IBM Plex Mono",monospace}
.foot{display:flex;gap:14px;font:12px "IBM Plex Mono",monospace;color:var(--muted);margin-top:auto;flex-wrap:wrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:1px}
.s-molto-attivo{background:var(--ok)} .s-attivo{background:var(--ok);opacity:.6} .s-poco-attivo{background:var(--warn)} .s-fermo,.s-archiviato,.s-sconosciuto{background:var(--off)}
dialog{max-width:760px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:14px;background:var(--paper);color:var(--ink);padding:0}
dialog::backdrop{background:rgba(20,16,12,.55)}
.dlg{padding:24px}
.dlg h2{font-family:Fraunces,serif;margin:6px 0 2px;font-size:28px;word-break:break-word}
.dlg h3{font:600 12px "IBM Plex Mono",monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:20px 0 8px}
.dlg ul{margin:0;padding-left:18px}
.techtable{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;font-size:14px}
.techtable dt{color:var(--muted)}
.techtable dd{margin:0;display:flex;flex-wrap:wrap;gap:5px}
.langbar{display:flex;height:10px;border-radius:5px;overflow:hidden}
.langleg{display:flex;flex-wrap:wrap;gap:4px 14px;font:12px "IBM Plex Mono",monospace;color:var(--muted);margin-top:6px}
.quote{border-left:3px solid var(--accent);padding:4px 0 4px 12px;color:var(--muted);font-style:italic;margin:0}
.close{position:sticky;top:0;float:right;margin:12px;border:none;background:var(--chip)}
.actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.btn{text-decoration:none;background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-weight:500}
.btn.alt{background:var(--chip);color:var(--ink)}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
.pill{font:11px "IBM Plex Mono",monospace;padding:2px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
footer{border-top:1px solid var(--line);padding:24px 0 40px;color:var(--muted);font-size:13px}
@media (max-width:820px){.controls{grid-template-columns:1fr 1fr}.controls input{grid-column:1/-1}.grid{grid-template-columns:1fr}.techtable{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="brand">
      <h1>Seta<span>c</span>cio</h1>
      <div class="tag">Il meglio dei repository pubblici di GitHub, setacciato e descritto: che prodotto è, con cosa è costruito, se è vivo.</div>
    </div>
    <div class="meta" id="meta">caricamento…</div>
    <div class="stats" id="stats"></div>
    <div class="typebar" id="typebar" title="Distribuzione per tipo di prodotto"></div>
  </div>
</header>

<div class="controls wrap" role="search">
  <input id="q" type="search" placeholder="Cerca per nome, descrizione, tecnologia…" aria-label="Cerca">
  <select id="fType" aria-label="Tipo"><option value="">Tutti i tipi</option></select>
  <select id="fLang" aria-label="Linguaggio"><option value="">Tutti i linguaggi</option></select>
  <select id="fTech" aria-label="Tecnologia"><option value="">Tutte le tecnologie</option></select>
  <select id="fStatus" aria-label="Stato"><option value="">Qualsiasi stato</option></select>
  <select id="sort" aria-label="Ordina">
    <option value="stars">★ Stelle</option>
    <option value="pushed">Aggiornati di recente</option>
    <option value="created">Più nuovi</option>
    <option value="name">Nome</option>
  </select>
</div>

<main class="wrap">
  <div class="count" id="count"></div>
  <div class="grid" id="grid"></div>
</main>

<dialog id="dlg"><button class="close" onclick="dlg.close()" aria-label="Chiudi">✕</button><div class="dlg" id="dlgBody"></div></dialog>

<footer><div class="wrap">Setaccio — dati dalla API pubblica di GitHub, aggiornati automaticamente. Le descrizioni sono generate in automatico e possono contenere imprecisioni.</div></footer>

<script>
const PALETTE=["#b4531f","#2f7a4b","#3d6aa8","#a1741a","#7a4fa0","#2a8a8a","#b03a5b","#5a6b2f","#8a5a3c","#4b5563","#c2410c","#0f766e","#6d28d9","#be123c","#4d7c0f","#1d4ed8","#a16207","#9d174d","#155e75","#57534e","#7c2d12","#334155"];
const LANG_COLORS={Python:"#3572A5",JavaScript:"#f1e05a",TypeScript:"#3178c6",Go:"#00ADD8",Rust:"#dea584",Java:"#b07219",Kotlin:"#A97BFF","C#":"#178600","C++":"#f34b7d",C:"#555555",PHP:"#4F5D95",Ruby:"#701516",Swift:"#F05138",Dart:"#00B4AB",Scala:"#c22d40",Elixir:"#6e4a7e",Shell:"#89e051",HTML:"#e34c26",CSS:"#563d7c",Lua:"#000080",Zig:"#ec915c","Jupyter Notebook":"#DA5B0B",Vue:"#41b883",Svelte:"#ff3e00"};
let DATA=[], typeColor={};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
const fmt=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace(".",",")+"k":String(n);
const slug=s=>String(s||"").toLowerCase().replace(/\s+/g,"-");
const ago=iso=>{if(!iso)return"—";const d=(Date.now()-new Date(iso))/864e5;if(d<1)return"oggi";if(d<30)return Math.round(d)+" gg fa";if(d<365)return Math.round(d/30)+" mesi fa";return (d/365).toFixed(1).replace(".",",")+" anni fa"};
const allTech=r=>Object.entries(r.technologies||{}).filter(([c])=>c!=="Linguaggio").flatMap(([,v])=>v);

function fillSelect(el,values){[...values].sort((a,b)=>b[1]-a[1]).forEach(([v,n])=>{const o=document.createElement("option");o.value=v;o.textContent=`${v} (${n})`;el.appendChild(o)})}
function countBy(list,fn){const m=new Map();list.forEach(r=>[].concat(fn(r)).filter(Boolean).forEach(v=>m.set(v,(m.get(v)||0)+1)));return m}

async function init(){
  try{
    const res=await fetch("data/repos.json",{cache:"no-store"});
    const j=await res.json(); DATA=j.repos||[];
    $("meta").textContent=`${DATA.length} progetti · aggiornato ${new Date(j.generated_at).toLocaleString("it-IT")}`;
  }catch(e){$("meta").textContent="Nessun dato ancora: esegui lo scanner.";DATA=[]}
  const types=countBy(DATA,r=>r.type);
  [...types.entries()].sort((a,b)=>b[1]-a[1]).forEach(([t],i)=>typeColor[t]=PALETTE[i%PALETTE.length]);
  fillSelect($("fType"),types);
  fillSelect($("fLang"),countBy(DATA,r=>r.primary_language));
  fillSelect($("fTech"),[...countBy(DATA,allTech)].filter(([,n])=>n>=2).length?new Map([...countBy(DATA,allTech)].filter(([,n])=>n>=2)):countBy(DATA,allTech));
  fillSelect($("fStatus"),countBy(DATA,r=>r.status));
  const stars=DATA.reduce((a,r)=>a+r.stars,0), techs=countBy(DATA,allTech).size, active=DATA.filter(r=>/attivo/i.test(r.status)&&!/poco/i.test(r.status)).length;
  $("stats").innerHTML=[["Progetti",DATA.length],["Stelle totali",fmt(stars)],["Tipi di prodotto",types.size],["Tecnologie rilevate",techs],["Attivi",DATA.length?Math.round(active*100/DATA.length)+"%":"—"]]
    .map(([l,v])=>`<div class="stat"><b>${v}</b><small>${l}</small></div>`).join("");
  $("typebar").innerHTML=[...types.entries()].sort((a,b)=>b[1]-a[1]).map(([t,n])=>`<i style="width:${n*100/DATA.length}%;background:${typeColor[t]}" title="${esc(t)}: ${n}"></i>`).join("");
  const params=new URLSearchParams(location.hash.slice(1));
  ["q","fType","fLang","fTech","fStatus","sort"].forEach(id=>{if(params.get(id))$(id).value=params.get(id);$(id).addEventListener("input",render)});
  render();
}

function render(){
  const q=$("q").value.trim().toLowerCase(), t=$("fType").value, l=$("fLang").value, te=$("fTech").value, s=$("fStatus").value, so=$("sort").value;
  let list=DATA.filter(r=>(!t||r.type===t)&&(!l||r.primary_language===l)&&(!te||allTech(r).includes(te))&&(!s||r.status===s)&&
    (!q||[r.full_name,r.github_description,r.text,r.summary,r.type,(r.topics||[]).join(" "),allTech(r).join(" ")].join(" ").toLowerCase().includes(q)));
  const by={stars:(a,b)=>b.stars-a.stars,pushed:(a,b)=>new Date(b.pushed_at)-new Date(a.pushed_at),created:(a,b)=>new Date(b.created_at)-new Date(a.created_at),name:(a,b)=>a.name.localeCompare(b.name)};
  list.sort(by[so]);
  const h=new URLSearchParams();["q","fType","fLang","fTech","fStatus","sort"].forEach(id=>{const v=$(id).value;if(v&&!(id==="sort"&&v==="stars"))h.set(id,v)});
  history.replaceState(null,"",h.toString()?"#"+h:location.pathname);
  $("count").textContent=`${list.length} risultati`;
  $("grid").innerHTML=list.length?list.slice(0,600).map(card).join(""):`<div class="empty">Nessun progetto corrisponde ai filtri.</div>`;
}

function card(r){
  const tech=allTech(r).slice(0,7);
  return `<article class="card" tabindex="0" onclick="openRepo('${esc(r.full_name)}')" onkeydown="if(event.key==='Enter')openRepo('${esc(r.full_name)}')">
    <div class="top"><img src="${esc(r.avatar)}&s=68" alt="" loading="lazy"><div><div class="name">${esc(r.name)}</div><div class="owner">${esc(r.owner)}</div></div></div>
    <span class="type" style="color:${typeColor[r.type]};background:color-mix(in srgb,${typeColor[r.type]} 14%,transparent)">${esc(r.type)}</span>
    <p class="desc">${esc(r.github_description||r.summary||"").slice(0,200)}</p>
    <div class="chips">${r.primary_language?`<span class="chip lang"><span class="dot" style="background:${LANG_COLORS[r.primary_language]||"var(--muted)"}"></span>${esc(r.primary_language)}</span>`:""}${tech.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>
    <div class="foot"><span>★ ${fmt(r.stars)}</span><span>⑂ ${fmt(r.forks)}</span><span><span class="dot s-${slug(r.status)}"></span>${esc(r.status)}</span><span>${ago(r.pushed_at)}</span></div>
  </article>`;
}

function openRepo(name){
  const r=DATA.find(x=>x.full_name===name); if(!r)return;
  const techRows=Object.entries(r.technologies||{}).filter(([c])=>c!=="Linguaggio").map(([c,v])=>`<dt>${esc(c)}</dt><dd>${v.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</dd>`).join("");
  const langs=r.languages||[];
  const list=(title,arr)=>arr&&arr.length?`<h3>${title}</h3><ul>${arr.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:"";
  $("dlgBody").innerHTML=`
    <span class="type" style="color:${typeColor[r.type]};background:color-mix(in srgb,${typeColor[r.type]} 14%,transparent)">${esc(r.type)}</span>
    <h2>${esc(r.name)}</h2><div class="owner">${esc(r.owner)} · ${r.owner_type==="Organization"?"organizzazione":"utente"} ${r.license?`· <span class="pill">${esc(r.license)}</span>`:""} <span class="pill">descrizione: ${esc(r.source)}</span></div>
    <h3>Descrizione</h3><p>${md(r.text)}</p>
    ${r.github_description?`<p class="quote">${esc(r.github_description)}</p>`:""}
    ${r.summary&&r.summary!==r.github_description?`<h3>Dal README</h3><p>${esc(r.summary)}</p>`:""}
    ${list("Punti di forza",r.strengths)}${list("Casi d'uso",r.use_cases)}${list("Funzionalità dichiarate",r.features)}
    <h3>A chi serve</h3><p>${esc(r.audience)}</p>
    ${techRows?`<h3>Tecnologie</h3><dl class="techtable">${techRows}</dl>`:""}
    ${langs.length?`<h3>Linguaggi</h3><div class="langbar">${langs.map(([l,p])=>`<i style="width:${p}%;background:${LANG_COLORS[l]||"var(--muted)"}" title="${esc(l)} ${p}%"></i>`).join("")}</div><div class="langleg">${langs.map(([l,p])=>`<span><span class="dot" style="background:${LANG_COLORS[l]||"var(--muted)"}"></span>${esc(l)} ${p}%</span>`).join("")}</div>`:""}
    ${r.install&&r.install.length?`<h3>Installazione</h3><div class="chips">${r.install.map(x=>`<span class="chip">${esc(x)}</span>`).join("")}</div>`:""}
    ${r.topics&&r.topics.length?`<h3>Topic</h3><div class="chips">${r.topics.map(x=>`<span class="chip">#${esc(x)}</span>`).join("")}</div>`:""}
    <h3>Numeri</h3><div class="foot"><span>★ ${r.stars.toLocaleString("it-IT")} stelle</span><span>⑂ ${r.forks.toLocaleString("it-IT")} fork</span><span>${r.open_issues} issue aperte</span><span>creato ${new Date(r.created_at).getFullYear()}</span><span>ultimo push ${ago(r.pushed_at)}</span><span>${r.dependencies_count} dipendenze</span></div>
    <div class="actions"><a class="btn" href="${esc(r.url)}" target="_blank" rel="noopener">Apri su GitHub</a>${r.homepage?`<a class="btn alt" href="${esc(r.homepage)}" target="_blank" rel="noopener">Sito del progetto</a>`:""}</div>`;
  $("dlg").showModal();
}
init();
</script>
</body>
</html>
